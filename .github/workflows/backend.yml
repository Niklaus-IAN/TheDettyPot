name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dettypot
          POSTGRES_PASSWORD: dettypot
          # Must end in _test: the suite wipes and re-migrates it on every run.
          POSTGRES_DB: dettypot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dettypot -d dettypot_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://dettypot:dettypot@localhost:5432/dettypot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The suite leaves the test database fully migrated; the committed
      # src/db/types.ts must match it.
      - run: npm run db:types:check
      - run: npm run build
